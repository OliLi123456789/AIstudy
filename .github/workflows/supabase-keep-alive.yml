# Keeps the Supabase free-tier project from pausing due to inactivity.
# Free projects are paused after ~7 days without API traffic. This workflow
# pings the project every 2 days, and can also be run manually from the
# Actions tab.
#
# Note: GitHub disables scheduled workflows in repositories that have had no
# commits for 60 days, so keep pushing periodically while this matters.
#
# Optional (recommended): add the publishable key so the ping authenticates
# properly (200 instead of 401 — though any request counts as traffic):
#   GitHub repo → Settings → Secrets and variables → Actions → Variables
#   Name: SUPABASE_ANON_KEY   Value: your VITE_SUPABASE_PUBLISHABLE_KEY
# The publishable key is client-safe (it ships in the public JS bundle).

name: Supabase keep-alive

on:
  schedule:
    # Every 2 days at 07:00 UTC.
    - cron: "0 7 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        env:
          ANON: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          url="https://jwgdgetsarmgqqrzzcqe.supabase.co/auth/v1/health"
          if [ -n "$ANON" ]; then
            echo "Pinging with publishable key…"
            curl -fsS --retry 3 --retry-delay 10 -H "apikey: $ANON" "$url"
            echo "Supabase responded OK."
          else
            echo "::warning::SUPABASE_ANON_KEY variable not set — sending an unauthenticated ping (expect 401; it still counts as project traffic)."
            curl -sS --retry 3 --retry-delay 10 -o /dev/null -w "unauthenticated ping: %{http_code}\n" "$url"
            # Also touch the project root as a second signal.
            curl -sS --retry 3 --retry-delay 10 -o /dev/null -w "root ping: %{http_code}\n" "https://jwgdgetsarmgqqrzzcqe.supabase.co/"
          fi
